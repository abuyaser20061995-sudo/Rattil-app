<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useRef } from 'react';
import ReactDOM from 'react-dom/client';
import {
  Home, BookOpen, Mic, Brain, User, Settings, Flame, CheckCircle2,
  XCircle, ChevronRight, ChevronLeft, Search, Moon, Sun, RotateCcw,
  Target, Award, TrendingUp, Loader2, Play, Pause, Square, ArrowRight
} from 'lucide-react';

// ============================================================================
// أدوات عامة
// ============================================================================
const toAr = (n) => n.toString().replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

const normalizeArabic = (str) => (str || '')
  .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '')
  .replace(/\u0640/g, '')
  .replace(/[إأآا]/g, 'ا')
  .replace(/ى/g, 'ي')
  .replace(/ة/g, 'ه')
  .replace(/[^\u0600-\u06FF\s]/g, '')
  .replace(/\s+/g, ' ')
  .trim();

const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
const pickRandom = (arr, n) => shuffle(arr).slice(0, n);

// ============================================================================
// التخزين المحلي
// ============================================================================
const storage = {
  get: (key, def) => { try { const v = localStorage.getItem(`rattil_${key}`); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
  set: (key, val) => { try { localStorage.setItem(`rattil_${key}`, JSON.stringify(val)); } catch (e) {} }
};

function useLocalStorage(key, initial) {
  const [val, setVal] = useState(() => storage.get(key, initial));
  const update = (v) => {
    const next = v instanceof Function ? v(val) : v;
    setVal(next);
    storage.set(key, next);
  };
  return [val, update];
}

// ============================================================================
// طبقة بيانات القرآن (API + كاش محلي)
// ============================================================================
async function fetchSurahList() {
  const cached = storage.get('surah_list', null);
  if (cached) return cached;
  const res = await fetch('https://api.alquran.cloud/v1/surah');
  const data = await res.json();
  const list = data.data.map(s => ({
    id: s.number, name: s.name,
    type: s.revelationType === 'Meccan' ? 'مكية' : 'مدنية',
    ayahsCount: s.numberOfAyahs
  }));
  storage.set('surah_list', list);
  return list;
}

// --- IndexedDB: تخزين نص المصحف كامل محلياً للعمل بدون إنترنت ---
function idbOpenDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('rattilDB', 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('surahs')) db.createObjectStore('surahs', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
      if (!db.objectStoreNames.contains('pages')) db.createObjectStore('pages', { keyPath: 'page' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbGetSurah(id) {
  try {
    const db = await idbOpenDB();
    return await new Promise((resolve) => {
      const tx = db.transaction('surahs', 'readonly');
      const req = tx.objectStore('surahs').get(id);
      req.onsuccess = () => resolve(req.result ? req.result.ayahs : null);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}

async function idbSetSurah(id, ayahs) {
  try {
    const db = await idbOpenDB();
    return await new Promise((resolve) => {
      const tx = db.transaction('surahs', 'readwrite');
      tx.objectStore('surahs').put({ id, ayahs });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch (e) { return false; }
}

async function idbGetPage(pageNum) {
  try {
    const db = await idbOpenDB();
    return await new Promise((resolve) => {
      const tx = db.transaction('pages', 'readonly');
      const req = tx.objectStore('pages').get(pageNum);
      req.onsuccess = () => resolve(req.result ? req.result.ayahs : null);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}

async function idbSetPage(pageNum, ayahs) {
  try {
    const db = await idbOpenDB();
    return await new Promise((resolve) => {
      const tx = db.transaction('pages', 'readwrite');
      tx.objectStore('pages').put({ page: pageNum, ayahs });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch (e) { return false; }
}

async function idbGetMeta(key) {
  try {
    const db = await idbOpenDB();
    return await new Promise((resolve) => {
      const tx = db.transaction('meta', 'readonly');
      const req = tx.objectStore('meta').get(key);
      req.onsuccess = () => resolve(req.result ? req.result.value : null);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}

async function idbSetMeta(key, value) {
  try {
    const db = await idbOpenDB();
    return await new Promise((resolve) => {
      const tx = db.transaction('meta', 'readwrite');
      tx.objectStore('meta').put({ key, value });
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch (e) { return false; }
}

async function fetchSurahAyahs(surahId) {
  const cached = await idbGetSurah(surahId);
  if (cached) return cached;
  const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahId}/quran-uthmani`);
  const data = await res.json();
  const list = data.data.ayahs.map(a => ({ number: a.numberInSurah, text: a.text, page: a.page }));
  await idbSetSurah(surahId, list);
  return list;
}

// جلب آيات صفحة كاملة من المصحف (٦٠٤ صفحة حسب طباعة مجمع الملك فهد)
async function fetchPageAyahs(pageNum) {
  const cached = await idbGetPage(pageNum);
  if (cached) return cached;
  const res = await fetch(`https://api.alquran.cloud/v1/page/${pageNum}/quran-uthmani`);
  const data = await res.json();
  const list = data.data.ayahs.map(a => ({
    surahNumber: a.surah.number,
    surahName: a.surah.name,
    number: a.numberInSurah,
    text: a.text
  }));
  await idbSetPage(pageNum, list);
  return list;
}

// أول صفحة تبدأ فيها كل سورة (تُحسب من بيانات السورة نفسها بعد جلبها)
async function getSurahStartPage(surahId) {
  const ayahs = await fetchSurahAyahs(surahId);
  return ayahs[0] ? ayahs[0].page : 1;
}

// أول صفحة لكل جزء من الأجزاء الثلاثين (وفق ترقيم مصحف المدينة القياسي - ٦٠٤ صفحة)
const JUZ_START_PAGES = [1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];

async function downloadFullMushaf(surahsList, onProgress) {
  for (let i = 0; i < surahsList.length; i++) {
    await fetchSurahAyahs(surahsList[i].id);
    onProgress(i + 1, surahsList.length);
  }
  await idbSetMeta('full_download_complete', true);
}

// ============================================================================
// طبقة تتبع الحفظ (تكرار متباعد مبسط)
// ============================================================================
function markAyahResult(surahId, ayahNumber, success) {
  const key = `${surahId}:${ayahNumber}`;
  const map = storage.get('mem_map', {});
  const entry = map[key] || { status: 'new', interval: 0, reps: 0 };
  if (success) {
    entry.reps = (entry.reps || 0) + 1;
    entry.interval = entry.reps === 1 ? 1 : entry.reps === 2 ? 3 : Math.round((entry.interval || 1) * 2.2);
    entry.status = entry.reps >= 2 ? 'memorized' : 'learning';
  } else {
    entry.reps = 0;
    entry.interval = 1;
    entry.status = 'learning';
  }
  entry.lastReview = Date.now();
  entry.due = Date.now() + entry.interval * 86400000;
  map[key] = entry;
  storage.set('mem_map', map);
  updateStreak();
  return entry;
}

function updateStreak() {
  const streak = storage.get('streak', { count: 0, lastDate: null });
  const today = new Date().toDateString();
  if (streak.lastDate !== today) {
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    streak.count = streak.lastDate === yesterday ? (streak.count || 0) + 1 : 1;
    streak.lastDate = today;
    storage.set('streak', streak);
  }
  return streak;
}

function getDueRefs() {
  const map = storage.get('mem_map', {});
  const now = Date.now();
  return Object.keys(map)
    .filter(k => map[k].due && map[k].due <= now)
    .map(k => { const [surahId, ayahNumber] = k.split(':').map(Number); return { surahId, ayahNumber }; });
}

function getMemStats() {
  const map = storage.get('mem_map', {});
  const values = Object.values(map);
  return {
    memorized: values.filter(v => v.status === 'memorized').length,
    learning: values.filter(v => v.status === 'learning').length,
    total: 6236
  };
}

function getWirdCursor() {
  return storage.get('wird_cursor', { surahId: 1, ayahNum: 1 });
}
function advanceCursor(surahId, ayahNum, surahsList) {
  const surah = surahsList.find(s => s.id === surahId);
  let nextAyah = ayahNum + 1, nextSurah = surahId;
  if (surah && nextAyah > surah.ayahsCount) { nextSurah = surahId >= 114 ? 1 : surahId + 1; nextAyah = 1; }
  storage.set('wird_cursor', { surahId: nextSurah, ayahNum: nextAyah });
}

async function buildQueueFromRefs(refs, surahsList) {
  const bySurah = {};
  refs.forEach(r => { (bySurah[r.surahId] = bySurah[r.surahId] || []).push(r.ayahNumber); });
  const queue = [];
  for (const sid of Object.keys(bySurah)) {
    const ayahs = await fetchSurahAyahs(Number(sid));
    const meta = surahsList.find(s => s.id === Number(sid));
    bySurah[sid].forEach(num => {
      const a = ayahs.find(x => x.number === num);
      if (a) queue.push({ surahId: Number(sid), surahName: meta ? meta.name : '', number: num, text: a.text });
    });
  }
  return queue;
}

// ============================================================================
// عناصر واجهة عامة (تصميم جديد: بطاقات داكنة بحدود ذهبية رفيعة)
// ============================================================================
const Panel = ({ children, className = "", onClick }) => (

    {children}

);

    primary: "bg-[#C9A227] text-[#0B1F1D] hover:bg-[#D4AF37] font-bold",

};

        {items.map(item => {

// الصفحة الرئيسية
// ============================================================================
const HomePage = ({ navigate, surahsList, startWird, startReview, mushafDownloaded, downloadProgress, startDownload }) => {
  const streak = storage.get('streak', { count: 0, lastDate: null });
  const stats = getMemStats();
  const due = getDueRefs();
  const pct = Math.min(100, Math.round((stats.memorized / stats.total) * 1000) / 10);

  return (
    <div className="pb-28">
      <TopBar title="رَتِّل" subtitle="مصحفك للحفظ والإتقان"
        right={<div className="flex items-center gap-1 text-[#C9A227] bg-[#1A3733] px-3 py-1.5 rounded-full">
          <Flame size={16} /><span className="text-sm font-bold">{toAr(streak.count || 0)}</span>
        </div>} />

      <div className="p-4 space-y-4">
        {!mushafDownloaded && (
          <Panel className="border-[#C9A227]/40 bg-[#C9A227]/5">
            <h3 className="font-bold text-[#C9A227] mb-1">نزّل المصحف كامل</h3>
            <p className="text-sm text-stone-400 mb-3">مرة واحدة وأنت متصل بالإنترنت، وبعدها يصير كل شيء (القراءة، التسميع، الحفظ) شغال بدون إنترنت نهائياً.</p>
            {downloadProgress ? (
              <div>
                <div className="w-full bg-[#1A3733] rounded-full h-2 mb-2">
                  <div className="bg-[#C9A227] h-2 rounded-full transition-all" style={{ width: `${(downloadProgress.done / downloadProgress.total) * 100}%` }}></div>
                </div>
                <p className="text-xs text-stone-400 text-center">جاري التنزيل: {toAr(downloadProgress.done)} من {toAr(downloadProgress.total)} سورة</p>
              </div>
            ) : (
              <GoldButton fullWidth onClick={startDownload}>تنزيل المصحف الآن</GoldButton>
            )}
          </Panel>
        )}

        <Panel className="bg-gradient-to-br from-[#132C29] to-[#0B1F1D] border-[#C9A227]/30">
          <div className="flex justify-between items-start mb-3">
            <div>
              <p className="text-stone-400 text-xs mb-1">الورد اليومي</p>
              <h2 className="text-xl font-bold text-white">تابع حفظك اليوم</h2>
            </div>
            <div className="w-14 h-14 rounded-full border-4 border-[#C9A227] flex items-center justify-center text-[#C9A227] font-bold text-sm">
              {toAr(pct)}٪
            </div>
          </div>
          <GoldButton fullWidth onClick={startWird}><Mic size={18} /> ابدأ ورد اليوم</GoldButton>
        </Panel>

        {due.length > 0 && (
          <Panel className="border-amber-500/30 bg-amber-500/5">
            <div className="flex justify-between items-center">
              <div>
                <h3 className="font-bold text-amber-400 flex items-center gap-2 mb-1"><RotateCcw size={16} /> مراجعة مستحقة</h3>
                <p className="text-sm text-stone-400">{toAr(due.length)} آية بانتظار المراجعة</p>
              </div>
              <GoldButton variant="outline" onClick={startReview}>راجع</GoldButton>
            </div>
          </Panel>
        )}

        <div className="grid grid-cols-2 gap-3">
          <Panel className="text-center">
            <p className="text-2xl font-bold text-white">{toAr(stats.memorized)}</p>
            <p className="text-xs text-stone-400 mt-1">آية محفوظة</p>
          </Panel>
          <Panel className="text-center">
            <p className="text-2xl font-bold text-white">{toAr(stats.learning)}</p>
            <p className="text-xs text-stone-400 mt-1">قيد الحفظ</p>
          </Panel>
        </div>

        <div className="grid grid-cols-3 gap-3">
          {[
            { id: 'browse', icon: BookOpen, label: 'المصحف' },
            { id: 'quiz', icon: Target, label: 'اختبرني' },
            { id: 'hifz', icon: TrendingUp, label: 'تقدمي' },
          ].map(a => (
            <button key={a.id} onClick={() => navigate(a.id)} className="flex flex-col items-center gap-2">
              <div className="w-12 h-12 rounded-xl bg-[#1A3733] flex items-center justify-center text-[#C9A227]">
                <a.icon size={20} />
              </div>
              <span className="text-[11px] text-stone-300">{a.label}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
};

const TOTAL_PAGES = 604;

const IndexOverlay = ({ surahsList, onClose, onGoToPage }) => {
  const [tab, setTab] = useState('surah');
  const [loadingId, setLoadingId] = useState(null);

  const openSurah = async (s) => {
    setLoadingId(s.id);
    const page = await getSurahStartPage(s.id);
    setLoadingId(null);
    onGoToPage(page);
  };

  return (
    <div className="fixed inset-0 z-50 bg-[#0B1F1D] flex flex-col">
      <TopBar title="الفهرس" onBack={onClose} />
      <div className="flex border-b border-[#22403C]">
        <button onClick={() => setTab('surah')} className={`flex-1 py-3 text-sm font-bold ${tab === 'surah' ? 'text-[#C9A227] border-b-2 border-[#C9A227]' : 'text-stone-500'}`}>السور</button>
        <button onClick={() => setTab('juz')} className={`flex-1 py-3 text-sm font-bold ${tab === 'juz' ? 'text-[#C9A227] border-b-2 border-[#C9A227]' : 'text-stone-500'}`}>الأجزاء</button>
      </div>
      <div className="flex-1 overflow-y-auto p-3">
        {tab === 'surah' ? (
          <div className="space-y-1">
            {surahsList.map(s => (
              <button key={s.id} onClick={() => openSurah(s)}
                className="w-full flex items-center justify-between p-3 rounded-xl bg-[#132C29] active:bg-[#1A3733]">
                <div className="flex items-center gap-3">
                  <span className="w-8 h-8 rounded-full border border-[#C9A227]/40 text-[#C9A227] text-xs flex items-center justify-center font-bold">{toAr(s.id)}</span>
                  <div className="text-right">
                    <p className="text-stone-100 font-bold quran-text">{s.name}</p>
                    <p className="text-stone-500 text-xs">{s.type} • {toAr(s.ayahsCount)} آية</p>
                  </div>
                </div>
                {loadingId === s.id && <Loader2 size={16} className="animate-spin text-[#C9A227]" />}
              </button>
            ))}
          </div>
        ) : (
          <div className="grid grid-cols-3 gap-2">
            {JUZ_START_PAGES.map((p, i) => (
              <button key={i} onClick={() => onGoToPage(p)}
                className="p-4 rounded-xl bg-[#132C29] text-center active:bg-[#1A3733]">
                <p className="text-[#C9A227] font-bold text-lg">{toAr(i + 1)}</p>
                <p className="text-stone-500 text-[11px]">الجزء</p>
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );

const MushafPage = ({ surahsList, navigate, setRecitationQueue }) => {

// ============================================================================
// جلسة التسميع الصوتي الحي
// ============================================================================
const RecitationSession = ({ queue, navigate, surahsList, source }) => {
  const [idx, setIdx] = useState(0);
  const [matchedCount, setMatchedCount] = useState(0);
  const [listening, setListening] = useState(false);
  const [supported, setSupported] = useState(true);
  const [permError, setPermError] = useState(false);
  const [sessionDone, setSessionDone] = useState(false);
  const recogRef = useRef(null);
  const targetWordsRef = useRef([]);
  const listeningRef = useRef(false);

  const current = queue[idx];

  useEffect(() => {
    if (!current) return;
    targetWordsRef.current = normalizeArabic(current.text).split(' ').filter(Boolean);
    setMatchedCount(0);
  }, [idx]);

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setSupported(false); return; }
    const recog = new SR();
    recog.lang = 'ar-SA';
    recog.continuous = true;
    recog.interimResults = true;
    recog.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) transcript += event.results[i][0].transcript + ' ';
      const spoken = normalizeArabic(transcript).split(' ').filter(Boolean);
      const target = targetWordsRef.current;
      let m = 0;
      for (let i = 0; i < spoken.length && m < target.length; i++) if (spoken[i] === target[m]) m++;
      setMatchedCount(prev => Math.max(prev, m));
    };
    recog.onerror = (e) => { if (e.error === 'not-allowed' || e.error === 'permission-denied') setPermError(true); };
    recog.onend = () => { if (listeningRef.current) { try { recog.start(); } catch (e) {} } };
    recogRef.current = recog;
    return () => { try { recog.stop(); } catch (e) {} };
  }, []);

  useEffect(() => {
    const target = targetWordsRef.current;
    if (target.length > 0 && matchedCount >= target.length) {
      markAyahResult(current.surahId, current.number, true);
      if (source === 'wird') advanceCursor(current.surahId, current.number, surahsList);
      const t = setTimeout(() => {
        if (idx < queue.length - 1) setIdx(i => i + 1);
        else { stopListening(); setSessionDone(true); }
      }, 800);
      return () => clearTimeout(t);
    }
  }, [matchedCount]);

  const startListening = () => {
    listeningRef.current = true;
    setListening(true);
    try { recogRef.current && recogRef.current.start(); } catch (e) {}
  };
  const stopListening = () => {
    listeningRef.current = false;
    setListening(false);
    try { recogRef.current && recogRef.current.stop(); } catch (e) {}
  };
  const skipAyah = () => {
    markAyahResult(current.surahId, current.number, false);
    if (idx < queue.length - 1) setIdx(i => i + 1);
    else { stopListening(); setSessionDone(true); }
  };

  if (!current || sessionDone) {
    return (
      <div className="min-h-screen bg-[#0B1F1D] flex flex-col items-center justify-center p-6 text-center">
        <div className="w-20 h-20 bg-[#C9A227]/20 rounded-full flex items-center justify-center text-[#C9A227] mb-6"><CheckCircle2 size={40} /></div>
        <h2 className="text-2xl font-bold text-white mb-2">أحسنت! أتممت الجلسة</h2>
        <p className="text-stone-400 mb-8">تم تسجيل تقدمك بنجاح</p>
        <GoldButton fullWidth onClick={() => navigate('home')} className="max-w-xs">العودة للرئيسية</GoldButton>
      </div>
    );
  }

  const words = normalizeArabic(current.text).split(' ').filter(Boolean);
  const displayWords = current.text.split(' ');

  return (
    <div className="min-h-screen bg-[#0B1F1D] flex flex-col">
      <TopBar title="التسميع الصوتي" subtitle={`${current.surahName} • آية ${toAr(current.number)} — ${toAr(idx + 1)} من ${toAr(queue.length)}`}
        onBack={() => { stopListening(); navigate('home'); }} />

      <div className="flex-1 flex flex-col p-5">
        <div className="w-full bg-[#1A3733] rounded-full h-1.5 mb-8">
          <div className="bg-[#C9A227] h-1.5 rounded-full transition-all" style={{ width: `${(idx / queue.length) * 100}%` }}></div>
        </div>

        {!supported ? (
          <div className="flex-1 flex flex-col items-center justify-center text-center px-4">
            <XCircle size={40} className="text-rose-400 mb-4" />
            <p className="text-stone-300">متصفحك لا يدعم التعرف الصوتي. جرّب فتح التطبيق عبر Google Chrome.</p>
          </div>
        ) : permError ? (
          <div className="flex-1 flex flex-col items-center justify-center text-center px-4">
            <Mic size={40} className="text-rose-400 mb-4" />
            <p className="text-stone-300">التطبيق يحتاج إذن استخدام الميكروفون. فعّله من إعدادات التطبيق بالجهاز.</p>
          </div>
        ) : (
          <React.Fragment>
            <Panel className="flex-1 flex items-center justify-center mb-6 min-h-[220px]">
              <p className="quran-text text-2xl leading-loose text-white text-center">
                {displayWords.map((w, i) => {
                  const norm = normalizeArabic(w);
                  const wordIdx = words.slice(0, i + 1).filter(Boolean).length - 1;
                  const isMatched = wordIdx < matchedCount;
                  return (
                    <span key={i} className={isMatched ? 'text-emerald-400 transition-all duration-300' : 'blur-md text-stone-500 select-none transition-all duration-300'}>{w}{' '}</span>
                  );
                })}
              </p>
            </Panel>

            <div className="flex flex-col items-center gap-4">
              <button onClick={listening ? stopListening : startListening}
                className={`w-20 h-20 rounded-full flex items-center justify-center transition-colors ${listening ? 'bg-rose-500 mic-active' : 'bg-[#C9A227]'}`}>
                {listening ? <Square size={26} className="text-white" fill="white" /> : <Mic size={28} className="text-[#0B1F1D]" />}
              </button>
              <p className="text-sm text-stone-400">{listening ? 'استمع... تكلم الآن' : 'اضغط لبدء الاستماع'}</p>
              <button onClick={skipAyah} className="text-xs text-stone-500 underline">تخطي هذه الآية</button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
};

const QuizPage = ({ navigate }) => {
  const [q, setQ] = useState(null);
  const [selected, setSelected] = useState(null);
  const [loading, setLoading] = useState(true);

  const generate = async () => {
    setLoading(true);
    setSelected(null);
    const ayahs = await fetchSurahAyahs(1);
    const idx = Math.floor(Math.random() * ayahs.length);
    const ayah = ayahs[idx];
    const words = ayah.text.trim().split(' ');
    if (words.length < 2) { setLoading(false); return generate(); }
    const lastWord = words[words.length - 1];
    const stem = words.slice(0, -1).join(' ') + ' ...';
    const distractors = ayahs.filter((_, i) => i !== idx).map(a => a.text.trim().split(' ').pop());
    const options = shuffle([lastWord, ...pickRandom(distractors, 3)]);
    setQ({ stem, options, correct: options.indexOf(lastWord) });
    setLoading(false);
  };

  useEffect(() => { generate(); }, []);

  return (
    <div className="min-h-screen bg-[#0B1F1D] flex flex-col">
      <TopBar title="اختبرني" onBack={() => navigate('home')} />
      <div className="flex-1 p-4 flex flex-col items-center justify-center">
        {loading ? (
          <Loader2 size={28} className="animate-spin text-[#C9A227]" />
        ) : q && (
          <div className="w-full max-w-sm">
            <Panel className="text-center p-6 mb-6">
              <p className="quran-text text-xl text-white leading-loose">{q.stem}</p>
            </Panel>
            <div className="space-y-3">
              {q.options.map((opt, i) => (
                <button key={i} onClick={() => setSelected(i)}
                  className={`w-full p-4 rounded-xl text-lg font-bold border-2 quran-text transition-all ${
                    selected === null ? 'bg-[#132C29] border-[#22403C] text-stone-200' :
                    i === q.correct ? 'bg-emerald-500/10 border-emerald-500 text-emerald-400' :
                    i === selected ? 'bg-rose-500/10 border-rose-500 text-rose-400' : 'bg-[#132C29] border-[#22403C] text-stone-500'
                  }`}>
                  {opt}
                </button>
              ))}
            </div>
            {selected !== null && (
              <GoldButton fullWidth className="mt-6" onClick={generate}>سؤال آخر</GoldButton>
            )}
          </div>
        )}
      </div>
    </div>
  );
};

// ============================================================================
// التطبيق الرئيسي
// ============================================================================
function App() {
  const [page, setPage] = useState('home');
  const [isDark, setIsDark] = useLocalStorage('dark_mode', true);
  const [wirdSize, setWirdSize] = useLocalStorage('wird_size', 5);
  const [surahsList, setSurahsList] = useState([]);
  const [recitationQueue, setRecitationQueue] = useState([]);
  const [recitationSource, setRecitationSource] = useState('manual');
  const [mushafDownloaded, setMushafDownloaded] = useState(false);
  const [downloadProgress, setDownloadProgress] = useState(null);

  useEffect(() => {
    if (isDark) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }, [isDark]);

  useEffect(() => { fetchSurahList().then(setSurahsList).catch(() => {}); }, []);
  useEffect(() => { idbGetMeta('full_download_complete').then(v => setMushafDownloaded(!!v)); }, []);

  const startDownload = async () => {
    if (surahsList.length === 0) return;
    setDownloadProgress({ done: 0, total: surahsList.length });
    await downloadFullMushaf(surahsList, (done, total) => setDownloadProgress({ done, total }));
    setMushafDownloaded(true);
    setDownloadProgress(null);
  };

  const navigate = (p) => { window.scrollTo({ top: 0 }); setPage(p); };

  const setQueueAndSource = (q, src) => { setRecitationQueue(q); setRecitationSource(src); };

  const startWird = async () => {
    if (surahsList.length === 0) return;
    const cursor = getWirdCursor();
    const ayahs = await fetchSurahAyahs(cursor.surahId);
    const meta = surahsList.find(s => s.id === cursor.surahId);
    const slice = ayahs.filter(a => a.number >= cursor.ayahNum).slice(0, wirdSize);
    if (slice.length === 0) return;
    setQueueAndSource(slice.map(a => ({ surahId: cursor.surahId, surahName: meta ? meta.name : '', number: a.number, text: a.text })), 'wird');
    navigate('recite-session');
  };

  const startReview = async () => {
    const refs = getDueRefs();
    if (refs.length === 0) return;
    const queue = await buildQueueFromRefs(refs, surahsList);
    setQueueAndSource(queue, 'review');
    navigate('recite-session');
  };

  const bottomTabs = ['home', 'browse', 'recite', 'hifz', 'profile'];

  return (
    <div dir="rtl" className="bg-stone-100 dark:bg-[#0B1F1D] min-h-screen">
      <div className="max-w-md mx-auto min-h-screen bg-[#FBF6EC] dark:bg-[#0B1F1D] relative shadow-2xl overflow-x-hidden">
        {page === 'home' && surahsList.length > 0 && <HomePage navigate={navigate} surahsList={surahsList} startWird={startWird} startReview={startReview} mushafDownloaded={mushafDownloaded} downloadProgress={downloadProgress} startDownload={startDownload} />}
        {page === 'home' && surahsList.length === 0 && (
          <div className="min-h-screen flex flex-col items-center justify-center text-stone-400">
            <Loader2 size={28} className="animate-spin mb-3" /> جاري تحميل بيانات القرآن...
          </div>
        )}
        {page === 'browse' && <MushafPage surahsList={surahsList} navigate={navigate} setRecitationQueue={setQueueAndSource} />}
        {page === 'recite' && <RecitePickerPage surahsList={surahsList} setRecitationQueue={setQueueAndSource} navigate={navigate} />}
        {page === 'recite-session' && <RecitationSession queue={recitationQueue} navigate={navigate} surahsList={surahsList} source={recitationSource} />}
        {page === 'hifz' && <HifzPage navigate={navigate} startReview={startReview} wirdSize={wirdSize} setWirdSize={setWirdSize} />}
        {page === 'quiz' && <QuizPage navigate={navigate} />}
        {page === 'profile' && <ProfilePage isDark={isDark} toggleDark={() => setIsDark(!isDark)} />}

        {bottomTabs.includes(page) && <BottomNav current={page} navigate={navigate} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
